<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historian — minimal commit table</title>
<style>
  :root {
    --bg: #fff; --fg: #1a1a1a; --muted: #666; --line: #ddd;
    --accent: #2456c6; --row-hi: #f2f6ff; --drawer: #fafafa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161616; --fg: #e8e8e8; --muted: #aaa; --line: #3a3a3a;
      --accent: #7aa2ff; --row-hi: #232c44; --drawer: #1e1e1e;
    }
  }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif;
         margin: 0 auto; max-width: 1100px; padding: 16px; }
  header h1 { margin: 0 0 2px; font-size: 22px; }
  .sub { margin: 0 0 16px; color: var(--muted); }
  #drop { border: 2px dashed var(--line); border-radius: 8px; padding: 28px;
          text-align: center; color: var(--muted); }
  #drop.over { border-color: var(--accent); background: var(--row-hi); }
  #status { color: var(--muted); min-height: 1.5em; }
  #summary { margin: 12px 0; }
  #empty { border: 1px solid var(--line); border-radius: 8px; padding: 28px; text-align: center; }
  table#commits { width: 100%; border-collapse: collapse; }
  table#commits th, table#commits td { border-bottom: 1px solid var(--line);
    padding: 6px 10px; text-align: left; }
  table#commits th { position: sticky; top: 0; background: var(--bg); cursor: pointer;
    user-select: none; white-space: nowrap; }
  table#commits th:focus, table#commits tr:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  table#commits tbody tr { cursor: pointer; }
  table#commits tbody tr:hover { background: var(--row-hi); }
  .num { text-align: right !important; font-variant-numeric: tabular-nums; }
  #drawer { position: fixed; top: 0; right: 0; width: min(560px, 94vw); height: 100vh;
    overflow: auto; background: var(--drawer); border-left: 1px solid var(--line);
    padding: 16px 20px 40px; box-sizing: border-box; }
  #drawer h2 { margin-top: 8px; font-size: 17px; }
  #drawer dl { display: grid; grid-template-columns: 150px 1fr; gap: 4px 12px; }
  #drawer dt { color: var(--muted); }
  #drawer dd { margin: 0; overflow-wrap: anywhere; }
  #drawer pre { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px; }
  table.files { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.files th, table.files td { border-bottom: 1px solid var(--line); padding: 4px 6px;
    text-align: left; vertical-align: top; overflow-wrap: anywhere; }
  .mono { font-family: ui-monospace, monospace; font-size: 12.5px; }
  a { color: var(--accent); }
  button, label.pick { cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Historian — minimal table</h1>
  <p class="sub">The smallest useful lens over <code>historian.json</code>: drag-drop, sortable commit table, detail drawer. No dependencies, no build step.</p>
</header>

<section id="drop" aria-label="Load historian JSON">
  <p>Drop a <code>historian.json</code> here, or
    <label class="pick">choose a file <input type="file" id="file" accept=".json,application/json" hidden></label>
    or <button type="button" id="sample">load sample</button></p>
</section>

<p id="status" role="status" aria-live="polite">Starting…</p>
<section id="summary" hidden></section>
<p id="empty" hidden>No commits in this file — nothing to show.</p>

<table id="commits" hidden>
  <thead id="chead"></thead>
  <tbody id="cbody"></tbody>
</table>

<aside id="drawer" hidden aria-label="Commit detail">
  <button type="button" id="dclose">← Close</button>
  <div id="dbody"></div>
</aside>

<script src="./app.js"></script>
</body>
</html>
