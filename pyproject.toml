[project]
name = "historian"
version = "0.1.0"
description = "Repo slop trajectory (verbosity + structural erosion) per commit, per file"
requires-python = ">=3.10"
dependencies = [
  "lizard>=1.17",
  "pyyaml>=6",
]

[dependency-groups]
dev = [
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
